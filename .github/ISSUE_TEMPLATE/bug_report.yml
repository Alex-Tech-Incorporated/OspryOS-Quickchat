name: Bug Report
description: Report a bug or issue with the Quickchat
labels: ["Bug"]
type: bug

body:
  - type: markdown
    attributes:
      value: "Before creating a Bug Report, please Update the Quickchat first, and check issues if the Bug has already been reported."
  
  - type: input
    id: quickchat-version
    attributes:
      label: Loader Version
      placeholder: I.e. 1.2.4
      description: You can find the Loader "OspryOS_Quickchat_Loader" > `Loader.Version`

  - type: dropdown
    id: device
    attributes:
      label: Device
      description: On what Device did you have the issue?
      options:
      - Mobile
      - Computer (PC)
      - Console
      - VR
      default: 1
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Please describe what exactly happened
      placeholder: Enter your description here!
    validations:
      required: true
  
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the bug you have found.
      placeholder: List the steps here!
    validations:
      required: true